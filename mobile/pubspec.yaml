name: mealtracker
description: MealTracker — ZigZag calorie tracking with AI meal analysis.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1

  # Storage
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.22
  path_provider: ^2.1.3
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Networking
  dio: ^5.5.0

  # Camera & image
  camera: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.2.0

  # Charts
  fl_chart: ^0.68.0

  # Connectivity
  connectivity_plus: ^6.0.3

  # Background tasks
  workmanager: ^0.9.0+3

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0

  # Speech-to-text
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1

  # Share sheet (receive shared images / text from other apps)
  receive_sharing_intent: ^1.8.0

  # Barcode scanning
  mobile_scanner: ^5.2.3

  # Home screen widget (Android AppWidget bridge)
  home_widget: ^0.7.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  generate: true
